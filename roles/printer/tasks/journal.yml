---
- name: journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Persist the journal (capped)
  ansible.builtin.template:
    src: journald-persistent.conf.j2
    dest: /etc/systemd/journald.conf.d/99-amun-printer.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart journald

- name: /var/log/journal exists (Storage=persistent needs the directory)
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  become: true
  notify: Restart journald
